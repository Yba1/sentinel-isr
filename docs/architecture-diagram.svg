<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#0b1220"/>

  <text x="700" y="40" text-anchor="middle" fill="#e5e7eb" font-size="24" font-weight="bold">Sentinel-ISR — architecture</text>
  <text x="700" y="64" text-anchor="middle" fill="#9ca3af" font-size="14">Graph schema (left) — five walkers, one frame loop (centre) — rendered picture (right)</text>

  <!-- ================= LEFT: Graph schema ================= -->
  <text x="150" y="105" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="bold">GRAPH SCHEMA</text>
  <text x="150" y="124" text-anchor="middle" fill="#6b7280" font-size="12">jac/graph.jac — the mission picture IS this graph</text>

  <!-- node boxes -->
  <g font-size="13">
    <rect x="40" y="145" width="220" height="34" rx="6" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="150" y="167" text-anchor="middle" fill="#2dd4bf">Mission (root)</text>

    <rect x="40" y="195" width="220" height="34" rx="6" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="150" y="217" text-anchor="middle" fill="#2dd4bf">Track</text>

    <rect x="40" y="245" width="220" height="34" rx="6" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <text x="150" y="267" text-anchor="middle" fill="#34d399">Zone (sanctuary / restricted)</text>

    <rect x="40" y="295" width="220" height="34" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="317" text-anchor="middle" fill="#f59e0b">Alert</text>

    <rect x="40" y="345" width="220" height="34" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="367" text-anchor="middle" fill="#f59e0b">Contact (radar evidence)</text>

    <rect x="40" y="395" width="220" height="34" rx="6" fill="#111827" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="150" y="417" text-anchor="middle" fill="#93c5fd">Brief</text>

    <!-- Hypothesis node, called out specially -->
    <rect x="40" y="455" width="220" height="34" rx="6" fill="#1f1030" stroke="#c084fc" stroke-width="2"/>
    <text x="150" y="477" text-anchor="middle" fill="#c084fc" font-weight="bold">Hypothesis</text>
  </g>

  <!-- edges list -->
  <g font-size="11.5" fill="#9ca3af">
    <text x="40" y="520">edges:</text>
    <text x="40" y="540">InZone (Track → Zone, since_t)</text>
    <text x="40" y="558">RaisedOn (Alert → Track)</text>
    <text x="40" y="576">Concerning (Alert → Zone)</text>
    <text x="40" y="594">JustifiedBy (Alert → Contact, weight)</text>
    <text x="40" y="612">Summarizes (Brief → Alert)</text>
    <text x="40" y="636" fill="#c084fc" font-weight="bold">Fork (Hypothesis → Hypothesis)</text>
  </g>

  <rect x="20" y="90" width="260" height="580" rx="10" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- ================= CENTRE: five walkers ================= -->
  <text x="700" y="105" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">FIVE WALKERS — one spawn per frame, on Mission</text>
  <text x="700" y="124" text-anchor="middle" fill="#6b7280" font-size="12">jac/main.jac — ScenarioDriver → Fusion → AlertScribe → Briefer → Renderer</text>

  <g font-size="13.5">
    <rect x="570" y="150" width="260" height="46" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="700" y="172" text-anchor="middle" fill="#fbbf24" font-weight="bold">ScenarioDriver</text>
    <text x="700" y="188" text-anchor="middle" fill="#9ca3af" font-size="10.5">scripted events: ais_off/on, radar, id-change</text>

    <line x1="700" y1="196" x2="700" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="570" y="224" width="260" height="46" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="700" y="246" text-anchor="middle" fill="#fbbf24" font-weight="bold">Fusion</text>
    <text x="700" y="262" text-anchor="middle" fill="#9ca3af" font-size="10.5">two-stage association + Kalman update</text>

    <!-- HYPOTHESIS FORK: explicit splitting arrow off Fusion -->
    <line x1="830" y1="247" x2="928" y2="215" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="830" y1="247" x2="928" y2="279" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="885" y="200" fill="#c084fc" font-size="10.5" font-weight="bold">ambiguous?</text>
    <rect x="930" y="196" width="150" height="26" rx="6" fill="#1f1030" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1005" y="214" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">Hyp. A (spawn)</text>
    <rect x="930" y="266" width="150" height="26" rx="6" fill="#1f1030" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1005" y="284" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">Hyp. B (spawn)</text>
    <text x="1005" y="245" text-anchor="middle" fill="#6b7280" font-size="9.5">Fork edge — a fork IS a spawn</text>
    <!-- pruning arrows converging back down -->
    <line x1="1005" y1="222" x2="1005" y2="238" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="1005" y1="292" x2="1005" y2="330" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <text x="1005" y="345" text-anchor="middle" fill="#6b7280" font-size="9.5">pruned/collapsed → Track</text>

    <line x1="700" y1="270" x2="700" y2="296" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="570" y="298" width="260" height="46" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="700" y="320" text-anchor="middle" fill="#fbbf24" font-weight="bold">AlertScribe</text>
    <text x="700" y="336" text-anchor="middle" fill="#9ca3af" font-size="10.5">by llm() headline phrasing, provenance-tracked</text>

    <line x1="700" y1="344" x2="700" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="570" y="372" width="260" height="46" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="700" y="394" text-anchor="middle" fill="#fbbf24" font-weight="bold">Briefer</text>
    <text x="700" y="410" text-anchor="middle" fill="#9ca3af" font-size="10.5">summary composition</text>

    <line x1="700" y1="418" x2="700" y2="444" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="570" y="446" width="260" height="46" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="700" y="468" text-anchor="middle" fill="#fbbf24" font-weight="bold">Renderer</text>
    <text x="700" y="484" text-anchor="middle" fill="#9ca3af" font-size="10.5">FrameDelta snapshot, pre-chewed for the map</text>
  </g>

  <rect x="550" y="90" width="700" height="440" rx="10" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- graph schema -> walkers -->
  <line x1="280" y1="230" x2="560" y2="230" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="420" y="222" text-anchor="middle" fill="#6b7280" font-size="10.5">reads/writes graph</text>

  <!-- Fork explanation callout -->
  <rect x="580" y="540" width="700" height="70" rx="8" fill="#1f1030" stroke="#c084fc" stroke-width="1.5"/>
  <text x="930" y="562" text-anchor="middle" fill="#e9d5ff" font-size="12.5" font-weight="bold">"This is Reid's MHT from 1979, standard in defense systems. What's new isn't</text>
  <text x="930" y="580" text-anchor="middle" fill="#e9d5ff" font-size="12.5" font-weight="bold">the algorithm — it's that hypothesis branching is native to Jac.</text>
  <text x="930" y="598" text-anchor="middle" fill="#e9d5ff" font-size="12.5" font-weight="bold">A fork is a walker spawn."</text>

  <!-- ================= RIGHT: Map ================= -->
  <text x="1220" y="105" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">MAP (frontend)</text>
  <text x="1220" y="124" text-anchor="middle" fill="#6b7280" font-size="12">renders FrameDelta verbatim, computes nothing</text>

  <rect x="1090" y="145" width="260" height="360" rx="10" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>

  <!-- sanctuary polygon -->
  <polygon points="1110,180 1230,165 1320,195 1300,260 1230,290 1130,260" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1220" y="175" text-anchor="middle" fill="#34d399" font-size="10">Monterey Bay NMS</text>

  <!-- confirmed vessel -->
  <circle cx="1160" cy="220" r="5" fill="#2dd4bf"/>
  <text x="1170" y="224" fill="#2dd4bf" font-size="10">confirmed</text>

  <!-- coasting/dark vessel with growing uncertainty ellipse -->
  <ellipse cx="1250" cy="240" rx="55" ry="30" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="1250" cy="240" r="5" fill="#f59e0b"/>
  <text x="1250" y="285" text-anchor="middle" fill="#f59e0b" font-size="10">coasting (dark) — ellipse grows</text>

  <!-- radar contact -->
  <rect x="1280" y="300" width="10" height="10" fill="#ef4444" transform="rotate(45 1285 305)"/>
  <text x="1285" y="328" text-anchor="middle" fill="#ef4444" font-size="10">radar contact</text>
  <line x1="1250" y1="245" x2="1285" y2="303" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowRed)"/>
  <text x="1300" y="270" fill="#ef4444" font-size="9.5">re-attribution</text>

  <!-- alert banner -->
  <rect x="1105" y="470" width="230" height="26" rx="5" fill="#111827" stroke="#f59e0b"/>
  <text x="1220" y="487" text-anchor="middle" fill="#f59e0b" font-size="10.5">⚠ went_dark / intrusion alert</text>

  <!-- walkers -> map -->
  <line x1="830" y1="469" x2="1080" y2="330" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="960" y="410" text-anchor="middle" fill="#6b7280" font-size="10.5">FrameDelta over jac serve (roadmap)</text>

</svg>
